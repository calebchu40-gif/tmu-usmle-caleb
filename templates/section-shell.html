<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
__HOST_BOOT__
  <style>__CSS__</style>
</head>
<body>
<!-- 只需编辑下方 quiz-data 内的 JSON。复制 questions 内的一项即可增加题目。
     每个文件是一个小节；题目 id 应稳定且唯一；answer 从 0 开始。
     不要修改下面的布局和脚本。文本中的小于号请写成 JSON 转义 \u003c。 -->
<script id="quiz-data" type="application/json">
__DATA__
</script>
<div class="quiz-shell">
  <div class="quiz-columns">
    <main id="question-list" class="question-scroll" aria-label="小节题目，可上下滚动" tabindex="0"></main>
    <aside class="section-sidebar" aria-label="小节进度与复习">
      <section class="side-card"><h2>本组进度</h2><div class="progress-row"><span>已完成</span><strong><span id="done-count">0</span> / <span id="total-count">0</span></strong></div><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div><p class="side-note">按已提交过的题目计数。每题独立提交。</p></section>
      <section class="side-card restart-card"><button id="refresh-questions" class="btn primary">刷新所有题目状态</button><p id="refresh-note" class="side-note" role="status">重新选择并作答本小节全部题目。保留历史次数、最后一次统计和复习标记。</p><p id="mode-note" class="mode-note" role="status"></p><button id="connect-retry" class="btn" hidden>重试连接</button></section>
      <section class="side-card mobile-summary"><h2>练习记录</h2><dl class="result-lists"><div class="result-group result-correct"><dt>答对：</dt><dd id="correct-questions" aria-label="答对题号"></dd></div><div class="result-group result-review"><dt>待复习：</dt><dd id="review-questions" aria-label="待复习题号"></dd></div></dl><p class="side-note">以最后一次答题状态为准。<br>待复习 = 未做 + 最后一次答错。<br>点击题号可定位到题目。</p></section>
      <section class="side-card"><h2>题目导航</h2><nav id="question-map" class="question-map" aria-label="跳转到题目"></nav><p class="side-note">绿色：答对 · 红色：错误 · 灰色：未做</p><button id="review-link" class="btn review-link">查看标记复习（<span id="marked-count">0</span>）</button></section>
      <section class="side-card info-card"><h2>解析结构</h2><p class="side-note">提交本题后查看答案依据和逐项解析。点击「再做一次」可重新作答；右上角保留累计正确与错误次数。</p></section>
    </aside>
  </div>
</div>
<script>__JS__</script>
</body>
</html>
