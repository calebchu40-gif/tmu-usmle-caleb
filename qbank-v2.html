<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b46">
  <title>USMLE Step 1 自建题库</title>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#172b3d;background:#f3f6f8;--navy:#102b46;--teal:#087f8c;--muted:#718194;--line:#e2e9ef;--red:#b44742;--green:#16845b}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}aside{background:var(--navy);color:#eef5fa;padding:20px 15px}.brand{font-size:18px;font-weight:700;margin:3px 7px 24px}.brand small{display:block;color:#9ab0c3;font-size:10px;font-weight:400}.mode{display:flex;gap:5px;background:#0a2036;padding:4px;border-radius:8px}.mode button{flex:1;background:transparent;border:0;color:#cbd7e0;padding:9px;border-radius:6px}.mode button.active{background:#214666;color:white}.label{font-size:10px;color:#9ab0c3;margin:16px 5px 6px}.side-select,.search{width:100%;border:1px solid #446079;background:#183a5b;color:white;border-radius:7px;padding:9px}.catlist{max-height:37vh;overflow:auto}.cat{width:100%;display:flex;justify-content:space-between;text-align:left;border:0;color:#d2dfeb;background:transparent;padding:8px;border-radius:6px;font-size:12px}.cat:hover,.cat.active{background:#214666;color:white}.sidefoot{font-size:11px;color:#b8cad8;line-height:1.5;margin-top:14px}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.account{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.wrap{max-width:1350px;padding:22px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.head h1{margin:3px 0;font-size:23px}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid #d7e1e8;background:white;color:#52687c;border-radius:7px;padding:8px 11px;font-size:12px}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.active{border-color:var(--teal);background:#e7f5f5;color:#08717a}.btn:disabled{opacity:.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}.card,.sidecard{background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden}.bar{display:flex;justify-content:space-between;padding:13px 17px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.body{padding:20px}.tags{display:flex;gap:7px;margin-bottom:12px}.tag{font-size:10px;background:#e7f5f5;color:#08717a;border-radius:20px;padding:5px 8px}.stem{white-space:pre-wrap;line-height:1.75;font-size:15px;margin:0 0 15px}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:#34495c;line-height:1.55}.choice.selected{border-color:var(--teal);background:#f0f9f9}.choice.correct{border-color:#66b58f;background:#eaf7f0}.choice.wrong{border-color:#d98b81;background:#fff0ed}.letter{width:24px;height:24px;flex:none;border:1px solid #ccd8e1;border-radius:50%;display:grid;place-items:center;font-size:10px}.visual{margin:12px 0}.visual img{width:100%;height:auto;border:1px solid var(--line);border-radius:7px;margin-top:8px}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 17px;border-top:1px solid var(--line)}.actions{display:flex;gap:6px;flex-wrap:wrap}.explain{display:none;border-top:1px solid var(--line);background:#f8fbfa;padding:18px;white-space:pre-wrap;line-height:1.7;font-size:13px}.explain.visible{display:block}.textbook{border-left:3px solid var(--teal);margin-top:13px;padding:9px 12px;background:#f2f7fa;font-size:12px;line-height:1.6}.fa-reference-list{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.fa-reference-list h4{margin:0 0 8px;font-size:13px}.fa-reference{background:#f4f7f9;border-radius:7px;padding:9px 11px;margin:7px 0;font-size:12px;line-height:1.6}.fa-reference strong{color:#08717a}.fa-reference p{margin:4px 0 0}.fa-reference img{display:block;max-width:100%;height:auto;margin-top:8px;border-radius:6px}.side{display:grid;gap:10px}.sidecard{padding:14px}.sidecard h2{font-size:13px;margin:0 0 9px}.gridnums{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:300px;overflow:auto;align-content:start}.num{aspect-ratio:1;border:1px solid var(--line);background:white;border-radius:6px;color:#52687c}.num.current{background:#087f8c;color:white;border-color:#087f8c}.num.wrong{border-color:#d98b81;color:#a43e37}.num.marked:after{content:"★";font-size:8px;display:block}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#f5f7f9;border-radius:7px;padding:9px}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--muted)}.toolrow{display:flex;gap:6px;flex-wrap:wrap}.login{position:fixed;inset:0;background:#102b46b8;z-index:5;display:grid;place-items:center;padding:20px}.login.hidden{display:none}.loginbox{width:min(400px,100%);background:white;border-radius:12px;padding:23px}.loginbox h2{margin:0 0 7px}.loginbox input{width:100%;padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:7px}.status{font-size:12px;color:var(--muted);min-height:18px}.hidden{display:none!important}.notice{padding:10px;background:#f2f7fa;border-radius:7px;font-size:11px;color:#52687c}.testpanel{display:grid;gap:9px}.testpanel label{display:grid;gap:5px;font-size:12px}.testpanel select{padding:8px;border:1px solid var(--line);border-radius:7px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.sidecard:first-child{grid-column:1/-1}}@media(max-width:650px){.shell{display:block}aside{display:none}.wrap{padding:12px}.top{padding:10px 12px}.head{align-items:flex-start;flex-direction:column}.side{grid-template-columns:1fr}.sidecard:first-child{grid-column:auto}.body{padding:14px}.stem{font-size:14px}}
  </style>
</head>
<body>
<div class="shell">
  <aside><div class="brand">Step 1 题库<small>按 First Aid 章节整理</small></div><div class="mode"><button class="active" id="practiceMode">日常刷题</button><button id="testMode">测试模式</button></div><div class="label">First Aid 章节</div><select class="side-select" id="chapter"><option value="">全部章节</option></select><div class="label">First Aid 小节</div><div class="catlist" id="subList"></div><div class="label">搜索</div><input class="search" id="search" placeholder="搜索题干/小节"><div class="sidefoot" id="bankCount">载入中…</div></aside>
  <main class="main"><header class="top"><div class="muted">Step 1 自建题库 / <b id="crumb">全部章节</b></div><div class="account"><span id="accountLabel">尚未连接账号</span><button class="btn" id="loginButton">登录</button><button class="btn hidden" id="logoutButton">退出</button></div></header>
  <div class="wrap"><section class="head"><div><div class="muted" id="modeLabel">知识点练习 · 即时反馈</div><h1 id="title">载入题库中…</h1><div class="muted" id="subtitle">提交后显示题目解析与教材知识摘要。</div></div><div class="actions"><label class="btn"><input type="checkbox" id="timerToggle"> 本题计时</label><button class="btn" id="markButton">☆ 手动标记</button><button class="btn" id="retryButton">重新作答</button></div></section>
  <section class="layout" id="quizLayout"><article class="card"><div class="bar"><span><b id="index">—</b> <span id="total">/ —</span>　<span id="timer">00:00</span></span><span id="saveState">请先登录以同步答题记录</span></div><div class="body"><div class="tags"><span class="tag" id="chapterTag"></span><span class="tag" id="subTag"></span></div><p class="stem" id="stem"></p><div id="images" class="visual"></div><div class="choices" id="choices"></div></div><div class="foot"><span class="muted" id="hint"></span><div class="actions"><button class="btn" id="prev">上一题</button><button class="btn primary" id="submit">提交答案</button><button class="btn" id="next">下一题</button><button class="btn primary hidden" id="finish">交卷</button></div></div><div class="explain" id="explanation"></div></article>
  <aside class="side"><section class="sidecard"><h2>题号导航</h2><div class="muted" id="navigatorNote">点击题号跳转</div><div class="gridnums" id="navigator"></div></section><section class="sidecard"><h2>本题统计</h2><div class="stats"><div class="stat"><b id="attempts">0</b><span>作答次数</span></div><div class="stat"><b id="wrongAttempts">0</b><span>答错次数</span></div></div><div class="toolrow" style="margin-top:9px"><button class="btn" id="markedFilter">手动标记</button><button class="btn" id="wrongFilter">错题记录</button><button class="btn" id="refresh">重新练习本组</button></div></section><section class="sidecard" id="testSetup"><h2>测试设置</h2><div class="testpanel"><label>题量<select id="testCount"><option value="10">10 题</option><option value="20">20 题</option><option value="40">40 题</option><option value="all">全部筛选题</option></select></label><label>计时<select id="testTimer"><option value="on">开启</option><option value="off">关闭</option></select></label><button class="btn primary" id="startTest">开始测试</button></div></section><section class="sidecard"><h2>本组进度</h2><div class="stats"><div class="stat"><b id="progress">0 / 0</b><span>已作答</span></div><div class="stat"><b id="accuracy">0%</b><span>正确率</span></div></div><p class="muted" id="totalTime"></p></section></aside></section>
  <section class="card hidden" id="testResults" style="margin-top:14px;padding:18px"></section></div></main></div>
<div class="login hidden" id="loginModal"><form class="loginbox" id="loginForm"><h2>登录学习账号</h2><p class="muted">答题记录会保存到账号，可在其他设备登录后同步。</p><input type="email" id="email" autocomplete="username" placeholder="邮箱" required><input type="password" id="password" autocomplete="current-password" placeholder="密码" required><div class="status" id="loginStatus"></div><div class="actions"><button type="button" class="btn" id="cancelLogin">取消</button><button class="btn primary" type="submit">登录并同步</button></div></form></div>
<script src="./assets/cloud.js"></script>
<script type="module" src="./assets/qbank-app.js"></script>
</body>
</html>
