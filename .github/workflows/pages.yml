name: Publish HTML library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run test suite
        run: |
          set +e
          npm test 2>&1 | tee /tmp/qbank-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo '### Test failure details' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 /tmp/qbank-test.log >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Test suite failed::See the test failure details in this run summary."
          fi
          exit "$result"
      - name: Check JavaScript syntax
        run: for file in assets/*.js; do node --check "$file"; done
      - name: Build site and discover HTML uploads
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
